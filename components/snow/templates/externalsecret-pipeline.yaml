{{- if and .Values.pipelineCredentials.enabled .Values.pipelineCredentials.namespace }}
{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
# -----------------------------------------------------------------------------
# The snow-mock API credentials, copied into the PIPELINE namespace so the
# open-cve-snow-tickets task can authenticate. Same Vault entry as the UI
# password (snow-ui-password); the username comes from the chart value via
# the ESO template. Rendered by the snow chart but living in the pipeline
# namespace -- the same cross-namespace pattern the gitlab chart uses for
# the scm-auth secrets. If snow is disabled, this ExternalSecret does not
# exist, and the task's optional secret volume degrades to a skip.
# -----------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tssc-snow-api
  namespace: {{ .Values.pipelineCredentials.namespace }}
  labels:
    app: snow-mock
    app.kubernetes.io/part-of: tssc-validated-pattern
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: tssc-snow-api
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The template defines the OUTPUT keys: static username plus the
        # password pulled from the remoteRef below via the template
        # context ({{ "{{" }} .password {{ "}}" }}). Without the reference,
        # ESO syncs the value into the context but the rendered Secret
        # carries ONLY the static keys -- the task then finds no password
        # file and skips ticket creation (cluster-6vf9b, run a5onjd).
        username: {{ .Values.snow.auth.username | quote }}
        password: '{{ "{{" }} .password {{ "}}" }}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/snow-ui-password" $prefix | quote }}
        property: password
{{- end }}
