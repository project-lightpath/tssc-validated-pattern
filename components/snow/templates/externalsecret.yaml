{{- $prefix := .Values.vault.pathPrefix | default "tssc-validated-pattern" }}
{{- $store := .Values.vault.secretStoreName | default "vault-cluster" }}
# The UI password, generated into Vault by the vault-secrets component
# (entry snow-ui-password) and materialized here by ESO. Nothing is a Helm
# value. The username is fixed in values.yaml (auth.username).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snow-ui
  namespace: {{ .Values.namespace }}
  labels:
    app: snow-mock
    app.kubernetes.io/part-of: tssc-validated-pattern
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.snow.auth.passwordSecretName | quote }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: {{ printf "%s/snow-ui-password" $prefix | quote }}
        property: password
