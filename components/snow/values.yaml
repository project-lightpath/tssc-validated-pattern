# -----------------------------------------------------------------------------
# snow-mock: the ServiceNow ITSM simulator from the lightwell-workshop,
# vendored under files/snow-mock/ (upstream: redhat-ads-tech/snow-mock).
#
# What this chart adds on top of the workshop's deployment:
#
#   * HTTP Basic auth on the UI and API (optional, on by default here):
#     the password is a Vault credential (entry snow-ui-password,
#     generated by the vault-secrets component) materialized by ESO as the
#     Secret below. /api/v1/health stays unauthenticated for probes and
#     the registration Job. Leave snow.auth.username empty for the
#     upstream no-auth behavior.
#   * An application-registration Job: after the service is healthy it
#     creates one incident per demo application (cmdb_ci = the GitLab
#     path, the same convention the Automation Orchestrator integration
#     stamps, so a later AO wiring finds them), idempotently.
#
# Deliberately NOT included: any Automation Orchestrator / ticket-workflow
# integration. The board is display + registration only for now.
#
# The only value that MUST be set per cluster is cluster.subdomain;
# everything else derives from it.
# -----------------------------------------------------------------------------

cluster:
  # Apps subdomain of the target cluster, e.g. apps.cluster-abcde.example.com.
  # No leading dot. Required.
  subdomain: ""

namespace: snow

# Public hostname. Leave empty to derive snow.<subdomain>.
route:
  host: ""

snow:
  # Runtime image for the ConfigMap-carried app (the workshop's default
  # deployment shape; no published image needed). First pod start runs
  # `pip install` from PyPI into an emptyDir, so allow ~20s before
  # readiness.
  runtimeImage: registry.access.redhat.com/ubi9/python-311:latest

  stateStorage: 1Gi

  auth:
    # Fixed username; the password comes from Vault. Set username: "" to
    # disable authentication entirely (upstream behavior).
    username: demo
    # ESO-materialized Secret carrying key `password`.
    passwordSecretName: tssc-snow-ui-password

# Demo applications registered on the board by the registration Job. Each
# becomes one incident with cmdb_ci = <gitGroup>/<name> and the
# tssc-app-registration guid marker, created only when absent.
gitGroup: development
applications:
  - lightwell-java-demo-app
  - spring-boot-example-application

# Vault wiring for the ExternalSecret this chart renders (UI password).
vault:
  kvMount: secret
  pathPrefix: tssc-validated-pattern
  secretStoreName: vault-cluster

# Credentials for the pipeline namespace (open-cve-snow-tickets task):
# copies the snow-mock API username/password into tssc-app-ci as the
# tssc-snow-api Secret. Set enabled: false when Snow ticket creation
# should not be wired (the task then skips gracefully).
pipelineCredentials:
  enabled: true
  namespace: tssc-app-ci
