---
# Expose the EventListener so GitLab can reach it. The GitLab seeding job
# creates a Note Hook webhook on each application repository pointing at
# this Route's https:// host, with the gitlab-webhook-secret token.
# (OpenShift-specific; drop if you expose it another way.)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agentic-issue-commands
  labels:
    app.kubernetes.io/part-of: maven-build-ci
spec:
  to:
    kind: Service
    name: el-agentic-issue-commands
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
