                    (has(body.project.default_branch) && body.project.default_branch != null) ? body.project.default_branch : "main"
                # The commented-on issue's project-scoped number (iid), as a string,
                # so the opened MR can link back to it. Falls back to "" if absent.
                - key: issue_iid
                  expression: >-
                    (has(body.issue) && has(body.issue.iid) && body.issue.iid != null) ? string(body.issue.iid) : ""
      bindings:
        - ref: test-generation-issue-binding
      template:
        ref: test-generation-unit-issue-template
    - name: gitlab-issue-generate-tests-functional
